name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The python REPL end-to-end test skips itself when python is missing; install it so it runs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: dotnet build Puppetty.slnx -c Release

      - run: dotnet test Puppetty.slnx -c Release --no-build --logger "console;verbosity=normal"
