name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PUPPETTY_ARTIFACTS: ${{ github.workspace }}/puppetty-artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Real programs for the end-to-end and smoke tests. Tests skip themselves when one is missing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install vim, less, htop
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim less htop

      - run: dotnet build Puppetty.slnx -c Release

      - run: dotnet test Puppetty.slnx -c Release --no-build --logger "console;verbosity=normal"

      # Traces and actual snapshots written by failing assertions.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: puppetty-artifacts-${{ matrix.os }}
          path: puppetty-artifacts
          if-no-files-found: ignore
